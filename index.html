<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>SohoArchTimes — Slideshow</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><rect x='6' y='6' width='20' height='20' fill='none' stroke='%23ffffff' stroke-width='1.4'/></svg>">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,400,300&f[]=general-sans@500,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="Слайд-шоу SohoArchTimes">
    <!-- 16:9 frame that letterboxes inside the viewport -->
    <div class="frame" id="frame" aria-hidden="false">
      <!-- Two image layers stacked: current + preload next -->
      <img class="slide-img" id="imgA" alt="" aria-hidden="true">
      <img class="slide-img" id="imgB" alt="" aria-hidden="true">

      <!-- Loading indicator (Russian) -->
      <div class="loader" id="loader" role="status" aria-live="polite">
        <span class="loader-dot"></span>
        <span class="loader-label">Загрузка…</span>
      </div>

      <!-- Bottom-left metadata caption -->
      <figcaption class="caption" id="caption" aria-live="polite">
        <span class="cap-title"  id="capTitle"></span>
        <span class="cap-sep" aria-hidden="true">·</span>
        <span class="cap-arch"   id="capArch"></span>
        <span class="cap-sep" aria-hidden="true">·</span>
        <span class="cap-year"   id="capYear"></span>
        <span class="cap-sep" aria-hidden="true">·</span>
        <span class="cap-loc"    id="capLoc"></span>
      </figcaption>

      <!-- Discreet bottom-right counter / brand -->
      <div class="hud" id="hud">
        <span class="hud-brand">SohoArchTimes</span>
        <span class="hud-sep" aria-hidden="true">/</span>
        <span class="hud-count" id="hudCount"></span>
      </div>

      <!-- Fade-to-black overlay; opacity is animated by JS -->
      <div class="fade" id="fade"></div>
    </div>

    <!-- Discreet controls (Russian labels). Hidden until pointer movement. -->
    <div class="controls" id="controls" aria-label="Управление">
      <button class="ctl" id="btnPrev" type="button" title="Назад" aria-label="Предыдущий слайд">‹</button>
      <button class="ctl" id="btnPause" type="button" title="Пауза/Воспроизведение" aria-label="Пауза или воспроизведение">⏸</button>
      <button class="ctl" id="btnNext" type="button" title="Далее" aria-label="Следующий слайд">›</button>
      <button class="ctl" id="btnFull" type="button" title="Во весь экран" aria-label="Во весь экран">⤢</button>
    </div>

    <!-- First-launch hint (Russian) — auto-hides -->
    <div class="hint" id="hint">Нажмите в любом месте — для полноэкранного режима</div>
  </main>

  <script src="./app.js?v=20260516-letterbox-caption-band" defer></script>
</body>
</html>
