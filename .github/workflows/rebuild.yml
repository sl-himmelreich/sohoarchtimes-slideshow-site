# Пересборка slides.json по текущему публичному состоянию Telegram.
# Запускается ТОЛЬКО вручную (workflow_dispatch): кнопкой ⟳ на сайте
# (двойной клик — задать токен) или кнопкой Run workflow на GitHub.
# Никаких расписаний — автоматика запрещена правилами проекта (CLAUDE.md).
name: Rebuild site from Telegram

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pillow beautifulsoup4 numpy
      - name: Rebuild catalog from public Telegram state
        run: python ops/build_sohoarchtimes_catalog.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slides.json ops/site_data
          if git diff --cached --quiet; then
            echo "No changes — site already matches Telegram."
          else
            git commit -m "Rebuild slides.json from Telegram (site refresh)"
            git push
          fi
